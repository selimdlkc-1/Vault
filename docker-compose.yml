# Vault — tek ortam: local. Deploy adımı yoktur (mimari-kararlar INF-001).
# `docker-compose up` ile Postgres 16 + Redis 7 + apps/api + apps/web tek komutla ayağa kalkar
# (docs/09_DEV_WORKFLOW.md §6). Önkoşul: apps/api/.env, .env.example'dan kopyalanıp doldurulmuş olmalı.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
      POSTGRES_DB: vault
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      # `required: false`: repo taze klonlandığında .env henüz yoktur; env şeması
      # (src/config/env.schema.ts) zaten fail-fast doğruluyor, compose burada zorlamaz.
      - path: apps/api/.env
        required: false
    environment:
      # Container-içi ağ üzerinden erişim; .env'deki localhost değerlerini geçersiz kılar.
      DATABASE_URL: postgresql://vault:vault@postgres:5432/vault
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
